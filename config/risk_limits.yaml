# The 7 Invariant System Mitigations Configuration
# Source: bot.md (v2.5) & build.md (v2.5)

# Invariant 1 & 3: Timing Windows
timing:
  min_age_minutes: 8.0          # Enforces 8-minute post-graduation stabilization cooldown
  max_age_minutes: 25.0         # Upper limit for secondary momentum window
  buyback_cliff_window: [5.0, 8.0]  # Window where protocol buyback ends and volume collapses
  max_holding_timeout_minutes: 20.0 # Guardrail 7: Hard fallback liquidation timeout

# Invariant 2: Exit Architecture (Path A+ Only)
exit_strategy:
  mode: "PATH_A_PLUS"
  prohibit_tranche_exits: true  # Scaled exits (Path B) strictly forbidden for <$50
  total_swaps: 2                # 1 entry leg + 1 full liquidation leg
  initial_profit_hurdle_regime_a: 0.18  # +18% gross hurdle
  initial_profit_hurdle_regime_b: 0.14  # +14% gross hurdle
  ratchet_net_lock_min: 0.08    # +8% net locked once hurdle crossed
  ratchet_net_lock_max: 0.10    # +10% net locked
  trailing_stop_pct: 0.12       # 12% trailing stop below peak executable price

# Invariant 4: Dual-Hurdle Double Gate
preflight_gate:
  regime_a:
    max_expected_cost_pct: 7.00
    min_gross_profit_hurdle_pct: 18.00  # Midpoint of 16-22%
    max_stress_cost_pct: 10.00
  regime_b:
    max_expected_cost_pct: 6.00
    min_gross_profit_hurdle_pct: 14.00  # Midpoint of 12-16%
    max_stress_cost_pct: 10.00

# Invariant 5: Cluster & Burner Risk Thresholds (Phase 2)
cluster_risk:
  min_pretrade_lifetime_txs: 3  # Buyers with <3 txs flagged as fresh burners
  max_common_parent_funding_pct: 30.0  # Block if >30% funded by same 2-hop ancestor
  block_mint_authority: true    # Mint authority must be revoked
  block_freeze_authority: true  # Freeze authority must be revoked

# Invariant 6: Tip Caps & Sizing
execution:
  min_position_usd: 10.00
  max_position_usd: 25.00
  target_position_usd: 15.00
  max_concurrent_positions: 1   # Single position at a time
  entry_tip_cap_pct: 1.50
  emergency_exit_budget_sol: 0.005

# Invariant 7: Bankroll & Daily Ceilings
bankroll:
  total_capital_usd: 100.00
  daily_max_realized_loss_usd: 10.00  # Hard daily shutdown ceiling
  max_trades_per_day: 5
